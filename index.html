<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Cookie Run: Ovenbreak Archive</title>
    <!-- Install as an app (iOS Safari: Share → Add to Home Screen) -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="OB Archive" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#6a0dad" />
    <style>
      :root {
        --ink: #fff;
        --brick: #3a1f1c;
        --purple: #6a0dad;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        /* keep content clear of the iPhone notch / home bar in app mode */
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
        font:
          700 15px/1.3 "Trebuchet MS",
          system-ui,
          sans-serif;
        color: var(--ink);
        background: var(--brick);
        text-shadow:
          0 1px 0 #000,
          0 0 3px #000;
      }
      button {
        font: inherit;
        color: inherit;
        text-shadow: inherit;
        cursor: pointer;
      }
      .r-legendary {
        --c: linear-gradient(135deg, #ff6ec7, #ffd36e, #7dffb0, #6ec8ff, #c58bff);
      }
      .r-epic {
        --c: linear-gradient(#e24dff, #7b3ff2 60%, #5a2bb8);
      }
      .r-rare {
        --c: linear-gradient(#5fb0ff, #2f6fe0);
      }
      .r-common {
        --c: linear-gradient(#b98a5e, #7a5230);
      }
      .r-sanrio {
        --c: linear-gradient(#bfeaff, #6cc4ee);
      }
      .r-teenieping {
        --c: linear-gradient(#ffc2e0, #ff7fba);
      }
      .r-ppg {
        --c: linear-gradient(#ff7a9c, #e0245e);
      }
      .r-special {
        --c: linear-gradient(#fff08a, #f5b800);
      }
      #list {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        background: #00000040;
        flex-wrap: wrap;
      }
      .top h1 {
        font-size: 18px;
        margin: 0;
        flex: 1;
        min-width: 150px;
      }
      .top input {
        padding: 7px 10px;
        border-radius: 8px;
        border: 0;
        width: 130px;
        font: inherit;
      }
      .top select {
        padding: 7px;
        border-radius: 8px;
        border: 0;
        font: inherit;
      }
      .body {
        display: flex;
        flex: 1;
        min-height: 0;
      }
      .tabs {
        display: flex;
        flex-direction: column;
        width: 84px;
        background: #00000050;
      }
      .tabs button {
        background: none;
        border: 0;
        padding: 16px 4px;
        opacity: 0.55;
        font-size: 15px;
      }
      .tabs button.on {
        opacity: 1;
        color: #ffe45e;
        background: #ffffff18;
      }
      .tabs i {
        display: block;
        font-style: normal;
        font-size: 26px;
      }
      #grid {
        flex: 1;
        overflow: auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
        gap: 10px;
        padding: 12px;
        align-content: start;
      }
      .card {
        border: 3px solid #000;
        border-radius: 12px;
        background: #000;
        padding: 0;
        overflow: hidden;
        box-shadow: 0 0 10px #c0f;
      }
      .card .art {
        background: var(--c);
        height: 104px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 48px;
      }
      .card img {
        max-height: 100px;
        max-width: 100%;
        object-fit: contain;
      }
      .card .lv {
        position: absolute;
        top: 2px;
        left: 6px;
        font-size: 20px;
        color: #fff;
      }
      .card .nm {
        position: absolute;
        bottom: 2px;
        left: 0;
        right: 0;
        font-size: 12px;
        padding: 0 3px;
      }
      .card .bar {
        padding: 3px;
        font-size: 12px;
        background: #000;
      }
      #detail {
        display: none;
        height: 100%;
        background: radial-gradient(#8a10c8, #5a0c9a);
        flex-direction: column;
      }
      .dtop {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        font-size: 18px;
      }
      .back {
        background: none;
        border: 0;
        font-size: 30px;
        padding: 0 6px;
      }
      .main {
        flex: 1;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        padding: 6px 14px;
        overflow: auto;
      }
      .left {
        flex: 1 1 260px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
      }
      .badge {
        padding: 3px 22px;
        border-radius: 20px;
        background: var(--c);
        border: 2px solid #fff8;
      }
      .nm2 {
        font-size: 24px;
      }
      .pill {
        background: #ffffff30;
        border-radius: 8px;
        padding: 3px 8px;
        display: inline-block;
      }
      .green {
        color: #fff;
        cursor: pointer;
        background: #5fd12a;
        border-radius: 8px;
        padding: 3px 8px;
        border: 2px solid #fff6;
      }
      .sprite {
        align-self: center;
        font-size: 110px;
        margin: auto;
      }
      .sprite img {
        max-width: min(100%, 320px);
        max-height: 340px;
        object-fit: contain;
      }
      .sprite span img {
        max-width: 96px;
        max-height: 96px;
      }
      .right {
        flex: 1 1 300px;
        background: #0004;
        border-radius: 18px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .btns {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .btn {
        background: #c9a6ff;
        color: #fff;
        border: 2px solid #fff8;
        border-radius: 8px;
        padding: 6px 14px;
      }
      .lvbig {
        font-size: 34px;
        color: #ffe500;
        text-align: center;
      }
      .lvbig small {
        color: #ccc;
        font-size: 16px;
      }
      .tags {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .tags span {
        background: #ffffff20;
        color: #6ff;
        border-radius: 14px;
        padding: 3px 10px;
      }
      .pow {
        background: #0005;
        border-radius: 8px;
        text-align: center;
        font-size: 28px;
        padding: 4px;
      }
      .desc {
        background: #0005;
        border-radius: 10px;
        padding: 16px;
        text-align: center;
        white-space: pre-line;
        min-height: 110px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .rav {
        width: auto;
        height: 1.8em; /* relationship avatar size */
        max-width: none;
        max-height: none;
        vertical-align: middle;
        margin-right: 6px;
      }
      .lc .hp {
        display: block;
        font-size: 20px;
        font-weight: 700;
      }
      .max {
        height: 22px;
        background: #f5b800;
        border: 2px solid #000;
        border-radius: 3px;
        text-align: center;
        color: #fff;
        margin: 4px 0;
      }
      .done {
        background: #0007;
        border-radius: 12px;
        padding: 14px;
        text-align: center;
        color: #ffe500;
        font-size: 24px;
      }
      .foot {
        display: flex;
        gap: 12px;
        padding: 10px 14px;
        align-items: center;
      }
      .rw,
      .cs {
        background: #4a4a60;
        border: 3px solid #000;
        border-radius: 12px;
        padding: 8px 14px;
      }
      .cs {
        align-self: center;
        border-radius: 50%;
        width: 62px;
        height: 62px;
        border-color: #5f5;
        background: #2a2;
        padding: 0;
        font-size: 26px;
      }
      .cs small {
        display: block;
        font-size: 11px;
      }
      .modal {
        position: fixed;
        inset: 0;
        background: #000a;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 9;
        padding: 10px;
      }
      .sheet {
        background: #fff0c8;
        color: #4a2a10;
        text-shadow: none;
        border-radius: 14px;
        max-width: 960px;
        width: 100%;
        max-height: 92%;
        overflow: auto;
        border: 4px solid #f5a000;
      }
      .sheet h2 {
        margin: 0;
        background: #f5a000;
        color: #fff;
        padding: 10px 14px;
        text-shadow: 0 1px 0 #000;
        display: flex;
        justify-content: space-between;
      }
      .sheet h2 button {
        background: none;
        border: 0;
        font-size: 22px;
      }
      .sc {
        padding: 12px;
        display: flex;
        gap: 10px;
        overflow: auto;
      }
      .lc {
        min-width: 200px;
        flex: 1;
        background: #ffe5a8;
        border-radius: 10px;
        padding: 10px;
        text-align: center;
        white-space: pre-line;
      }
      .lc b {
        display: block;
        font-size: 20px;
      }
      .cc {
        min-width: 170px;
        flex: 1;
        background: #ffe5a8;
        border-radius: 10px;
        padding: 8px;
        text-align: center;
        font-size: 13px;
      }
      .cc .sp {
        font-size: 56px;
        height: 140px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 6px;
      }
      .cc .sp img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      /* Costume rarity colors */
      .t-legendary {
        --c: linear-gradient(#ffe27a, #e0a100);
      }
      .t-champion {
        --c: linear-gradient(#6fe08a, #1f9e4a);
      }
      .t-superepic {
        --c: linear-gradient(#ff6b6b, #c4152b);
      }
      .t-epic {
        --c: linear-gradient(#e24dff, #7b3ff2 60%, #5a2bb8);
      }
      .t-rare {
        --c: linear-gradient(#5fb0ff, #2f6fe0);
      }
      .t-common {
        --c: linear-gradient(#b98a5e, #7a5230);
      }
      .cc .g {
        font-size: 11px;
        margin: 4px 0;
      }
      .cc button {
        width: 100%;
        padding: 8px;
        border-radius: 10px;
        border: 2px solid #000;
        background: #ffd84a;
        color: #fff;
        text-shadow: 0 1px 0 #000;
      }
      .cc button.p {
        background: #9b2ee0;
      }
      .cc button.eq {
        background: #777;
      }
      .tier {
        display: inline-block;
        border-radius: 6px;
        padding: 1px 8px;
        color: #fff;
        background: var(--c);
        font-size: 11px;
      }
      .txt {
        padding: 14px;
        white-space: pre-line;
        font-weight: 600;
        line-height: 1.5;
      }
      .quote {
        background: #fff;
        border-radius: 10px;
        padding: 8px;
        text-align: center;
        margin: 0 14px;
      }
      .aff {
        padding: 6px 14px;
      }
      .aff div {
        padding: 6px 0;
        border-bottom: 1px solid #0002;
      }
      .candy {
        display: flex;
        flex: 1;
        flex-wrap: wrap;
        gap: 10px;
        padding: 8px 14px;
      }
      .nm2 .star,
      .star {
        background: none;
        border: 0;
        font-size: 26px;
        color: #9a9a9a;
        padding: 0 4px;
        vertical-align: middle;
        text-shadow: 0 1px 0 #000;
      }
      .star.on {
        color: #ffd800;
      }
      .fstar {
        position: absolute;
        top: 2px;
        right: 6px;
        color: #ffd800;
        font-size: 22px;
        z-index: 2;
      }
      .pow {
        position: relative;
      }
      .pow .heart {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 24px;
      }
      .desc {
        position: relative;
      }
      .info {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 2px solid #fff8;
        background: #9a8fb0;
        color: #fff;
        padding: 0;
        font-size: 16px;
        line-height: 1;
      }

      /* ---- Enhancement / official-look additions ---- */
      .tabs { overflow-y: auto; }
      .eico { width: 1em; height: 1em; vertical-align: -0.15em; }
      .enh {
        position: relative;
        background: #0005;
        border-radius: 10px;
        padding: 12px 48px;
        min-height: 58px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        white-space: pre-line;
      }
      .enh > .eico {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        width: 28px;
        height: 28px;
        color: #d9c9f2;
      }
      .enh .info { top: 50%; transform: translateY(-50%); }
      .max { position: relative; }
      .max::before {
        content: "";
        position: absolute;
        left: -8px;
        top: 50%;
        transform: translateY(-50%);
        width: 26px;
        height: 28px;
        background: linear-gradient(#ffc9ea, #c76fb0);
        clip-path: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0 50%);
      }
      .lc .lbox {
        background: #ffd98b;
        border-radius: 10px;
        padding: 12px;
        margin: 8px 0;
        min-height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
      }
      .lc .lbox.s {
        min-height: 0;
        position: relative;
        padding: 12px 12px 12px 46px;
      }
      .lc .lbox.s .eico {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        width: 26px;
        height: 26px;
      }
      .lc.e { background: #ffeec6; border: 2px solid #fbd88a; min-width: 250px; }
      .lc.e > b { white-space: nowrap; font-size: 19px; }
      .lc .rw2 { margin-top: 14px; font-size: 15px; opacity: 0.85; }
      /* Costume illustration viewer */
      .cc .sp.zoomable { position: relative; }
      .cc button.zoom {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 38px;
        height: 38px;
        padding: 0;
        border-radius: 50%;
        border: 2px solid #fff;
        background: #0008;
        font-size: 18px;
        line-height: 1;
        text-shadow: none;
      }
      #modal2 { z-index: 12; }
      #modal2 .sheet { width: min(1100px, 96vw); max-width: 96vw; }
      #modal2 img { display: block; max-width: 100%; max-height: calc(92vh - 70px); margin: 0 auto; }
      /* Release date + Affection Jelly */
      .rel {
        margin-left: auto;
        align-self: center;
        font-size: 14px;
        font-weight: 700;
        color: #e9d8ff;
        background: #0004;
        border-radius: 999px;
        padding: 6px 12px;
        white-space: nowrap;
      }
      .sheet h2 .rel { font-size: 13px; margin: 0 10px 0 14px; align-self: center; background: #0003; text-shadow: none; }
      .sheet h2 > span { flex: 1; display: flex; align-items: center; flex-wrap: wrap; }
      .jelly {
        background: #0007;
        border-radius: 12px;
        padding: 14px;
        margin-top: 8px;
        display: flex;
        gap: 14px;
        align-items: center;
        color: #fff;
      }
      .jelly .jimg {
        flex: 0 0 auto;
        width: 84px;
        height: 84px;
        border-radius: 14px;
        background: #ffffff1c;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 44px;
      }
      .jelly .jimg img { max-width: 72px; max-height: 72px; image-rendering: auto; }
      .jelly .jt small { display: block; color: #cbb3f5; font-size: 13px; letter-spacing: 0.3px; }
      .jelly .jt b { display: block; font-size: 19px; color: #ffe500; margin: 2px 0 6px; }
      .jelly .jt p { margin: 0; font-size: 15px; line-height: 1.4; white-space: pre-line; }
      /* Cookie illustration + Quotes tab */
      .sillust { text-align: center; padding: 6px 14px 0; }
      .sillust img { max-width: 100%; max-height: 440px; object-fit: contain; }
      .qh { font-size: 20px; font-weight: 800; padding: 4px 14px; color: #5a3a22; }
      .qt { margin: 0 14px 14px; border: 3px solid #5a3a22; border-radius: 14px; overflow: hidden; background: #e8ceb1; color: #3d2616; }
      .qt .qs { background: #84694f; color: #fff; text-align: center; font-weight: 800; padding: 6px; border-bottom: 1px solid #5a3a22; }
      .qt .qr { display: grid; grid-template-columns: 1fr 1fr; }
      .qt .qr > div { padding: 12px 10px; text-align: center; font-weight: 600; text-shadow: none; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #84694f; background: #e8ceb1; }
      .qt .qr > div.b { background: #efd8bf; }
      .qt .qr > div:nth-child(odd):not(.w) { border-right: 1px solid #84694f; }
      .qt .qr > div.w { grid-column: 1 / -1; }
      .qt > :last-child { margin-bottom: -1px; } /* hides the final divider under the outer border */
      .qt .qrow { display: grid; grid-template-columns: minmax(110px, 30%) 1fr; border-bottom: 1px solid #84694f; }
      .qt .ql { background: #7a5f48; color: #fff; font-weight: 800; text-align: center; padding: 12px 8px; display: flex; align-items: center; justify-content: center; border-right: 1px solid #5a3a22; text-shadow: 0 1px 0 #3a2616, 0 0 3px #3a2616; }
      .qt .qrow.b .ql { background: #84694f; }
      .qt .ql u { text-decoration: none; border-bottom: 2px solid #f3dfc4; }
      .qt .qv { padding: 12px 10px; text-align: center; font-weight: 600; text-shadow: none; display: flex; align-items: center; justify-content: center; background: #e8ceb1; }
      .qt .qrow.b .qv { background: #efd8bf; }
      /* Costume pop-up: card on the left, quotes on the right */
      .cosw { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; padding: 6px 14px 14px; justify-content: center; }
      .cosw .cc { flex: 0 1 320px; }
      .cosw .cq { flex: 1 1 380px; min-width: 0; }
      .cosw .qtitle { font-size: 22px; font-weight: 800; color: #5a3a22; padding: 4px 0 2px; }
      .cosw .qh { padding: 4px 0; }
      .cosw .qt { margin: 0 0 14px; }
      .cqe { font-weight: 600; color: #7a5a3a; padding: 16px; text-align: center; background: #fff8; border-radius: 12px; }
      @media (max-width: 600px) {
        .qt .qr { grid-template-columns: 1fr; }
        .qt .qr > div:nth-child(odd):not(.w) { border-right: 0; }
        .qt .qrow { grid-template-columns: 1fr; }
        .qt .ql { border-right: 0; border-bottom: 1px solid #5a3a22; }
      }

      /* ===== Phone layout ===== */
      .left { position: relative; }
      .candybtn { position: absolute; top: 56px; right: 8px; width: 104px; height: 104px; padding: 0; background: none; border: 0; font-size: 60px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
      .candybtn img { max-width: 100%; max-height: 100%; }
      .candybtn:active { transform: scale(0.92); }
      /* Wide screens: header floats over the top-left so the detail box can sit higher without being clipped */
      @media (min-width: 701px) {
        #detail { position: relative; }
        .dtop { position: absolute; top: 0; left: 0; z-index: 3; }
        .main { padding-top: 40px; }
        .left { padding-top: 14px; }
        .candybtn { top: 70px; }
      }
      @media (max-width: 700px) {
        .gnav.l { left: -46px; } .gnav.r { right: -46px; }
        .candybtn { top: 0; width: 76px; height: 76px; }
        .body { flex-direction: column-reverse; }
        .tabs { flex-direction: row; width: auto; overflow-x: auto; overflow-y: hidden; padding-bottom: env(safe-area-inset-bottom); border-top: 1px solid #fff3; }
        .tabs button { flex: 1 0 auto; min-width: 72px; padding: 8px 6px; font-size: 12px; }
        .tabs i { font-size: 22px; }
        #grid { overflow: auto; min-height: 0; padding: 8px; }
        .top { flex-wrap: wrap; }
        .sprite img { max-height: 250px; }
        .main { padding: 6px 10px; }
      }
      /* ===== Motion ===== */
      @keyframes fi { from { opacity: 0; } to { opacity: 1; } }
      @keyframes up { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
      @keyframes pop { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: none; } }
      @keyframes sl { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
      @keyframes sr { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: none; } }
      img { animation: fi 0.4s; }
      .modal { animation: fi 0.2s; }
      .modal .sheet { animation: up 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
      #modal2 .sheet { animation: pop 0.25s; }
      #detail.enter .main { animation: up 0.35s cubic-bezier(0.2, 0.8, 0.2, 1); }
      .card { animation: pop 0.3s both; animation-delay: calc(var(--n, 0) * 18ms); transition: transform 0.15s, box-shadow 0.15s; }
      .card:active { transform: scale(0.95); }
      @media (hover: hover) { .card:hover { transform: translateY(-3px); } }
      .tabs button, .btn { transition: opacity 0.2s, background 0.2s, transform 0.1s; }
      .btn:active, .tabs button:active { transform: scale(0.95); }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
      /* ===== Level slider ===== */
      .lvs { width: 100%; accent-color: #ffe45e; margin: 0 0 6px; height: 28px; }
      #powb:empty { display: none; }
      /* ===== Costume gallery ===== */
      .gal { position: relative; display: flex; align-items: center; justify-content: center; touch-action: pan-y; }
      .gframe { border: 3px solid var(--c); border-radius: 22px; padding: 10px; min-width: 200px; min-height: 200px; display: flex; align-items: center; justify-content: center;
        background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--c) 40%, transparent), transparent 70%); box-shadow: 0 0 22px color-mix(in srgb, var(--c) 55%, transparent); }
      .gframe.sl { animation: sl 0.3s; }
      .gframe.sr { animation: sr 0.3s; }
      .gnav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; width: 38px; height: 38px; border-radius: 50%; border: 2px solid #fff8; background: #0006; font-size: 24px; line-height: 1; padding: 0; }
      .gnav.l { left: -64px; } .gnav.r { right: -64px; }
      .gcap { font-size: 16px; display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 8px; }
      .gn { font-size: 18px; }
      .gd { display: flex; gap: 6px; }
      .gd i { width: 8px; height: 8px; border-radius: 50%; background: #fff5; transition: transform 0.2s; }
      .gd i.on { background: #ffe45e; transform: scale(1.4); }
      .gq { padding: 5px 16px; border-radius: 999px; border: 2px solid #fff8; background: #19b8d6; }
      .gq.on { background: #3aa84a; }

      /* ===== Rarity-based backgrounds ===== */
      .r-legendary, .t-legendary { --g: #ff8fd8; } .t-legendary { --g: #e0a100; }
      .r-epic, .t-epic { --g: #b45cff; }
      .r-rare, .t-rare { --g: #4f9bff; }
      .r-common, .t-common { --g: #b98a5e; }
      .r-sanrio { --g: #6cc4ee; } .r-teenieping { --g: #ff7fba; } .r-ppg, .t-superepic { --g: #e0245e; }
      .r-special { --g: #f5b800; } .t-champion { --g: #1f9e4a; }
      /* detail screen: the item's own rarity gradient, slightly darkened so panels stay readable */
      #detail[class*="r-"] { background: linear-gradient(rgba(10, 0, 30, 0.22), rgba(10, 0, 30, 0.5)), var(--c); }
      #detail.r-legendary { background: linear-gradient(180deg, #7b1fb5 0%, #5a55d6 38%, #2ba9d0 74%, #2fd0b5 100%); }
      /* cards: rarity gradient + orange MAX bar */
      .card.r-legendary .art { background: linear-gradient(180deg, #ff8ad8 0%, #b58cff 35%, #5fc8ff 70%, #3fe0c8 100%); }
      .card { box-shadow: 0 0 8px var(--g, #c0f); border-color: #1a0a2a; }
      /* Rarity tags (detail page + costume cards): indigo border, bold white text with dark outline */
      .left .badge {
        border: 3px solid #2a1a7a;
        box-shadow: 0 0 0 1px #ffffff55 inset, 0 1px 4px #0006;
        color: #fff;
        font-weight: 900;
        letter-spacing: 0.4px;
        text-shadow: -1.5px -1.5px 0 #25156a, 1.5px -1.5px 0 #25156a, -1.5px 1.5px 0 #25156a, 1.5px 1.5px 0 #25156a, 0 2px 0 #25156a;
      }
      .left.r-legendary .badge { background: linear-gradient(90deg, #5ef2b0 0%, #34c6f0 45%, #6a7bff 75%, #b06bff 100%); }
      .cc .tier {
        border: 2px solid #2a1a7a;
        border-radius: 999px;
        padding: 1px 12px;
        font-weight: 900;
        letter-spacing: 0.3px;
        text-shadow: -1px -1px 0 #25156a, 1px -1px 0 #25156a, -1px 1px 0 #25156a, 1px 1px 0 #25156a;
      }
      /* gallery frame: gradient border (the colors are gradients, so use the padding-box/border-box trick) */
      .gframe { border: 0; background: none; box-shadow: none; padding: 0; min-width: 0; min-height: 0; }

      /* ===== Shimmer + sparkle on high rarities ===== */
      @keyframes glint { 0%, 55% { transform: translateX(-130%); } 100% { transform: translateX(130%); } }
      @keyframes flt { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @keyframes twk { 0%, 100% { opacity: 0; transform: scale(0.4) rotate(0); } 50% { opacity: 1; transform: scale(1.1) rotate(25deg); } }
      .card:is(.r-legendary,.r-epic,.r-special,.r-sanrio,.r-teenieping,.r-ppg,.t-legendary,.t-champion,.t-superepic) .art { overflow: hidden; }
      .left:is(.r-legendary,.r-epic,.r-special,.r-sanrio,.r-teenieping,.r-ppg) .badge { position: relative; overflow: hidden; display: inline-block; }
      .card:is(.r-legendary,.r-epic,.r-special,.r-sanrio,.r-teenieping,.r-ppg,.t-legendary,.t-champion,.t-superepic) .art::after, .left:is(.r-legendary,.r-epic,.r-special,.r-sanrio,.r-teenieping,.r-ppg) .badge::after {
        content: ""; position: absolute; inset: 0; pointer-events: none;
        background: linear-gradient(115deg, transparent 38%, rgba(255, 255, 255, 0.5) 50%, transparent 62%);
        transform: translateX(-130%); animation: glint 3.6s ease-in-out infinite; animation-delay: calc(var(--n, 0) * 0.35s);
      }
      #detail:is(.r-legendary,.r-epic,.r-special,.r-sanrio,.r-teenieping,.r-ppg) .sprite { position: relative; animation: flt 4.5s ease-in-out infinite; }
      #detail:is(.r-legendary,.r-epic,.r-special,.r-sanrio,.r-teenieping,.r-ppg) .sprite::before, #detail:is(.r-legendary,.r-epic,.r-special,.r-sanrio,.r-teenieping,.r-ppg) .sprite::after {
        content: "✦"; position: absolute; color: #fff; text-shadow: 0 0 8px #fff; pointer-events: none; animation: twk 2.4s ease-in-out infinite;
      }
      #detail:is(.r-legendary,.r-epic,.r-special,.r-sanrio,.r-teenieping,.r-ppg) .sprite::before { top: 12%; left: 14%; font-size: 24px; }
      #detail:is(.r-legendary,.r-epic,.r-special,.r-sanrio,.r-teenieping,.r-ppg) .sprite::after { top: 28%; right: 12%; font-size: 17px; animation-delay: 1.2s; }
      /* ===== Illustration viewer ===== */
      .ivw { background: #120626; position: relative; overflow: hidden; height: calc(92vh - 70px); touch-action: none; cursor: grab; }
      .ivw img { position: absolute; left: 50%; top: 50%; max-width: 100%; max-height: 100%; transform: translate(-50%, -50%); user-select: none; -webkit-user-drag: none; animation: none; }
      .inav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 3; width: 42px; height: 42px; border-radius: 50%; border: 2px solid #fff8; background: #0007; color: #fff; font-size: 26px; line-height: 1; padding: 0; }
      .inav.l { left: 8px; } .inav.r { right: 8px; }
      .inav.t { top: 12px; right: 8px; left: auto; transform: none; }
      @media (max-width: 700px) {
        #modal2 .sheet { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; border-radius: 0; }
        .ivw { height: calc(100dvh - 64px); }
      }
      /* ===== Enhancement label, refresh UI ===== */
      .lvbig .elv { display: block; font-size: 17px; color: #fff; margin-top: -2px; }
      #ptr { position: fixed; top: env(safe-area-inset-top, 0px); left: 50%; transform: translate(-50%, -40px); opacity: 0; z-index: 30; background: #000a; padding: 6px 14px; border-radius: 999px; font-size: 14px; pointer-events: none; transition: opacity 0.15s; }
      #toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 30px); opacity: 0; pointer-events: none; z-index: 40; background: #241046; border: 2px solid #ffe45e; border-radius: 999px; padding: 8px 8px 8px 16px; display: flex; gap: 10px; align-items: center; transition: 0.25s; }
      #toast.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
      #toast button { background: #ffe45e; color: #3a1f00; border-radius: 999px; padding: 4px 12px; border: 0; text-shadow: none; }

      /* ===== Tap the cookie: speech bubble ===== */
      .sprite { position: relative; cursor: pointer; }
      .bubble {
        position: absolute; left: 50%; top: -6px; z-index: 6; pointer-events: none;
        width: max-content; max-width: min(280px, 80vw); padding: 10px 14px; border: 3px solid #2a1a3a; border-radius: 16px;
        background: #fff; color: #2a1a3a; font-size: 18px; font-weight: 800; line-height: 1.25; text-align: center; text-shadow: none;
        opacity: 0; transform: translate(-50%, -100%) scale(0.9); transition: opacity 0.4s, transform 0.25s;
      }
      .bubble.on { opacity: 1; transform: translate(-50%, -100%) scale(1); }
      .bubble::after {
        content: ""; position: absolute; left: 50%; bottom: -13px; width: 16px; height: 16px; background: #fff;
        border-right: 3px solid #2a1a3a; border-bottom: 3px solid #2a1a3a; transform: translateX(-50%) rotate(45deg);
      }

      /* ===== Image loading polish ===== */
      .ldg { position: relative; }
      .shim { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 2;
        background: linear-gradient(100deg, transparent 25%, rgba(255, 255, 255, 0.3) 50%, transparent 75%) 200% 0 / 200% 100% no-repeat, rgba(255, 255, 255, 0.08);
        animation: shim 1.2s linear infinite; }
      @keyframes shim { to { background-position: -200% 0, 0 0; } }
      img.il { opacity: 0; }
      .imgfb { font-size: inherit; line-height: 1; display: inline-flex; align-items: center; justify-content: center; opacity: 0.85; }
      /* ===== Affection track ===== */
      .atk { padding: 6px 14px 10px; }
      .atk .ah { display: flex; justify-content: space-between; align-items: baseline; font-size: 18px; }
      .atk .ah b { color: #5a3a22; }
      .atk .ah span { color: #c0235f; font-weight: 800; }
      .abar { position: relative; height: 16px; border-radius: 999px; background: #0002; margin: 16px 10px 8px; }
      .afill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, #ff9ec3, #ff3d7f); transition: width 0.15s; }
      .amk { position: absolute; top: 50%; width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 3px solid #c98a9a; transform: translate(-50%, -50%); transition: 0.2s; }
      .amk.on { background: #ff3d7f; border-color: #fff; box-shadow: 0 0 0 2px #ff3d7f; }
      .atk .lvs { accent-color: #ff3d7f; margin: 0; }
      .arow { display: flex; justify-content: space-between; gap: 10px; padding: 6px 10px; margin-top: 4px; border-radius: 8px; opacity: 0.45; transition: 0.2s; }
      .arow.on { opacity: 1; background: #ffffff80; }
      .arow small { display: block; color: #8a4a1a; font-weight: 600; }
      .abonus { margin-top: 8px; padding: 8px 10px; border-radius: 10px; background: #fff6; text-align: center; font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="list">
      <div class="top">
        <h1 id="count"></h1>
        <input id="q" placeholder="Search name or #tag…" /><select id="sort">
          <option value="rarity">Rarity: Highest → Lowest</option>
          <option value="rarity-asc">Rarity: Lowest → Highest</option>
          <option value="name">Name: A → Z</option>
          <option value="name-desc">Name: Z → A</option>
          <option value="released-new">Released: Newest</option>
          <option value="released-old">Released: Oldest</option>
          <option value="favorite">Favorite</option>
          <option value="level">Level</option>
        </select>
      </div>
      <div class="body">
        <div class="tabs" id="tabs"></div>
        <div id="grid"></div>
      </div>
    </div>
    <div id="detail"></div>
    <div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
    <div class="modal" id="modal2"><div class="sheet" id="sheet2"></div></div>
    <script src="cookies.js"></script>
    <script src="pets.js"></script>
    <script src="treasures.js"></script>
    <script>
      const RN = {
        legendary: "LEGENDARY",
        epic: "EPIC",
        rare: "RARE",
        common: "COMMON",
        sanrio: "SANRIO",
        teenieping: "TEENIEPING",
        ppg: "POWERPUFF GIRLS",
        special: "SPECIAL",
      };
      const ORDER = Object.keys(RN);
      // Costume rarity, highest first (collab tiers like sanrio still use RN above)
      const TIER = {
        legendary: "LEGENDARY",
        champion: "CHAMPION",
        superepic: "SUPER EPIC",
        epic: "EPIC",
        rare: "RARE",
        common: "COMMON",
      };
      const tierCls = (t) => (TIER[t] ? "t-" + t : "r-" + t);
      const tierName = (t) => TIER[t] || RN[t] || t;
      const TABS = {
        cookie: {
          label: "Cookie",
          icon: "🍪",
          data: () => window.COOKIES || [],
          plural: "Cookies",
        },
        pet: { label: "Pet", icon: "🐾", data: () => window.PETS || [], plural: "Pets" },
        treasure: {
          label: "Treasure",
          icon: "🔶",
          data: () =>
            (window.TREASURES || []).filter((t) =>
              ["legendary", "epic", "rare", "special"].includes(t.rarity),
            ),
          plural: "Treasures",
        },
        cookieCostume: {
          label: "Cookie Costume",
          icon: "👕",
          data: () => allCostumes("cookie"),
          plural: "Cookie Costumes",
        },
        petCostume: {
          label: "Pet Costume",
          icon: "🧢",
          data: () => allCostumes("pet"),
          plural: "Pet Costumes",
        },
      };
      // Costume rarity order (premium tiers first, then collab tiers)
      // Rarity ranking, HIGHEST first.
      // Items: Special + Collab sit above Epic. Costumes: Collab sits above Super Epic.
      const COS_ORDER = ["legendary","champion","sanrio","teenieping","ppg","special","superepic","epic","rare","common"];
      const ITEM_ORDER = ["legendary","sanrio","teenieping","ppg","special","epic","rare","common"];
      // "October 27, 2025" / "2025-10-27" -> timestamp (null when missing)
      const MONTHS = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
      function relTime(r) {
        if (!r) return null;
        const m = String(r).match(/([A-Za-z]{3,})\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(\d{4})/);
        if (m) {
          const mo = MONTHS.indexOf(m[1].slice(0, 3).toLowerCase());
          if (mo >= 0) return Date.UTC(+m[3], mo, +m[2]);
        }
        const t = Date.parse(r);
        return isNaN(t) ? null : t;
      }
      // Every non-default costume of every cookie / pet, flattened into one list
      const isCos = () => tab == "cookieCostume" || tab == "petCostume";
      function allCostumes(only) {
        const out = [];
        [["cookie", window.COOKIES], ["pet", window.PETS]]
          .filter(([type]) => !only || type == only)
          .forEach(([type, arr]) =>
          (arr || []).forEach((o, oi) =>
            (o.costumes || []).forEach((c, n) => {
              if (c.tier == "default") return;
              out.push({ ...c, id: `${type}:${o.id}:${n}`, rarity: c.tier, ownerIdx: oi, ownerType: type, ownerId: o.id, ownerName: o.name });
            }),
          ),
        );
        return out;
      }
      const ordOf = (i) =>
        (isCos() ? COS_ORDER : ITEM_ORDER).indexOf(i.rarity);
      // Enhancement helpers
      const enhIcon = () => {
        let s = "";
        for (let k = 0; k < 12; k++) {
          const a = (k * Math.PI) / 6, r1 = k % 2 ? 7 : 5, r2 = 10.5;
          s += `<line x1="${(12 + r1 * Math.cos(a)).toFixed(2)}" y1="${(12 + r1 * Math.sin(a)).toFixed(2)}" x2="${(12 + r2 * Math.cos(a)).toFixed(2)}" y2="${(12 + r2 * Math.sin(a)).toFixed(2)}"/>`;
        }
        return `<svg class="eico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">${s}</svg>`;
      };
      // Skill text is shown exactly as written (no number highlighting)
      const hl = (t) => String(t);
      const hlg = (t) => String(t);
      const enhList = (i) => (i.enhancements || []).slice().sort((a, b) => a.lv - b.lv);
      let prevTab = null;
      let tab = "cookie",
        cur = null,
        view = "main";
      const $ = (id) => document.getElementById(id);
      const lvOf = (i) => (i.levels ? Math.max(...i.levels.map((l) => l.lv), 1) : 0);
      // Candy levels use the same "levels" array as every other item.
      // (Old format { level: "5/5", desc } is still understood as a fallback.)
      const cLevels = (c) =>
        c.levels || [
          { lv: parseInt(c.level) || 1, desc: c.desc, reward: c.reward || "" },
        ];
      const cLast = (c) => cLevels(c)[cLevels(c).length - 1];
      const cMax = (c) =>
        c.levels
          ? Math.max(...c.levels.map((l) => l.lv), 1)
          : parseInt(String(c.level).split("/")[1]) || cLast(c).lv;
      const spr = (x) => (x.img ? `<img src="${x.img}" alt="" data-e="${x.emoji || ""}">` : x.emoji || "❔");
      const art = (i) => {
        const e = i.costumes && i.costumes.find((c) => c.equipped);
        return spr(e || i);
      };
      // List cards: treasures show their small "avatar" icon (falls back to the full sprite).
      // The detail page always uses art(i), i.e. the full sprite.
      const cardArt = (i) =>
        tab == "treasure" && i.avatar ? `<img src="${i.avatar}" alt="">` : art(i);
      let FAV = new Set();
      try {
        FAV = new Set(JSON.parse(localStorage.getItem("croFav") || "[]"));
      } catch (e) {}
      const isFav = (i) => FAV.has(tab + ":" + i.id);
      function toggleFav() {
        const k = tab + ":" + cur.id;
        FAV.has(k) ? FAV.delete(k) : FAV.add(k);
        try {
          localStorage.setItem("croFav", JSON.stringify([...FAV]));
        } catch (e) {}
        renderDetail();
        renderList();
      }
      // Always the default costume (falls back to the item's own sprite)
      const defSpr = (i) => {
        const d = i.costumes && i.costumes.find((c) => c.tier == "default");
        return spr(d && d.img ? d : i);
      };
      function skillInfo() {
        const i = cur;
        if (view == "candy") {
          modal(
            `${i.candy.name}'s Skill`,
            `<div class="sc" style="align-items:center"><div class="cc" style="flex:0 0 200px"><div class="sp" style="height:240px">${spr(i.candy)}</div></div><div class="txt" style="flex:1;text-align:center;font-size:17px">${i.candy.skillFull || "No detailed skill description yet."}</div></div>`,
          );
          return;
        }
        modal(
          `${i.name}'s Skill`,
          `<div class="sc" style="align-items:center"><div class="cc" style="flex:0 0 200px"><div class="sp" style="height:240px">${defSpr(i)}</div></div><div class="txt" style="flex:1;text-align:center;font-size:17px">${i.skillFull || "No detailed skill description yet."}</div></div>`,
        );
      }
      function renderList() {
        $("tabs").innerHTML = Object.entries(TABS)
          .map(
            ([k, t]) =>
              `<button class="${k == tab ? "on" : ""}" onclick="tab='${k}';renderList()"><i>${t.icon}</i>${t.label}</button>`,
          )
          .join("");
        let d = TABS[tab].data().slice(),
          q = $("q").value.toLowerCase(),
          s = $("sort").value;
        $("count").textContent = `All ${TABS[tab].plural}: ${d.length}`;
        // Search matches name, owner (costumes) and #tags; spaces and "#" are ignored
        const norm = (x) => String(x).toLowerCase().replace(/[\s#]/g, "");
        const nq = norm(q);
        d = d.filter((i) =>
          [i.name, i.ownerName || "", ...(i.tags || [])].some((x) => norm(x).includes(nq)),
        );
        const co = isCos();
        // Default order: rarity (highest first) -> costumes: owner (database order) then A-Z / items: level
        const rk = (a, b) => ordOf(a) - ordOf(b);
        const tie = co
          ? (a, b) => a.ownerIdx - b.ownerIdx || a.name.localeCompare(b.name)
          : (a, b) => lvOf(b) - lvOf(a);
        const base = (a, b) => rk(a, b) || tie(a, b);
        // Release date: items without a date always go last
        const dateCmp = (dir) => (a, b) => {
          const x = relTime(a.released), y = relTime(b.released);
          if (x === null && y === null) return 0;
          if (x === null) return 1;
          if (y === null) return -1;
          return (x - y) * dir;
        };
        const cmp = {
          rarity: base,
          "rarity-asc": (a, b) => -rk(a, b) || tie(a, b),
          name: (a, b) => a.name.localeCompare(b.name),
          "name-desc": (a, b) => b.name.localeCompare(a.name),
          "released-new": (a, b) => dateCmp(-1)(a, b) || base(a, b),
          "released-old": (a, b) => dateCmp(1)(a, b) || base(a, b),
          favorite: (a, b) => +isFav(b) - +isFav(a) || base(a, b),
          level: (a, b) => (co ? 0 : lvOf(b) - lvOf(a)) || base(a, b),
        }[s] || base;
        d.sort(cmp);
        $("grid").innerHTML =
          d
            .map(
              (i, k) =>
                `<button class="card ${co ? tierCls(i.rarity) : "r-" + i.rarity}" style="--n:${Math.min(k, 14)}" onclick="${co ? "openCostume" : "openItem"}('${i.id}')"><div class="art">${isFav(i) ? '<span class="fstar">★</span>' : ""}${cardArt(i)}<span class="nm">${i.name}</span></div></button>`,
            )
            .join("") || "<p>No entries yet.</p>";
      }
      function openCostume(id) {
        const c = TABS[tab].data().find((x) => x.id == id);
        if (!c) return;

        const l = view == "candy" ? cLevels(cur.candy) : cur.levels;
        const card = (x) =>
          `<div class="lc"><b>Lv.${x.lv}</b>${x.power ? `<b>❤️ ${x.power}</b>` : ""}<div class="lbox">${hlg(x.desc)}${x.extra ? "\n\n" + hlg(x.extra) : ""}</div>${x.reward ? `<div class="rw2">Level Up Reward:\n${x.reward}</div>` : ""}</div>`;
        const main = l[l.length - 1].desc;
        const enh =
          view == "candy"
            ? ""
            : enhList(cur)
                .map(
                  (e) =>
                    `<div class="lc e"><b>${enhIcon()} Enhancement Lv.${e.lv}</b><div class="lbox">${hlg(e.desc || main)}</div><div class="lbox s">${enhIcon()}<span>${hlg(e.effect)}</span></div><div class="rw2">${e.reward ? "Level Up Reward:\n" + e.reward : "No Level Up Reward"}</div></div>`,
                )
                .join("");
        modal("Level Info", `<div class="sc">${l.map(card).join("")}${enh}</div>`);
        if (enh) {
          const sc = document.querySelector("#sheet .sc");
          sc.scrollLeft = sc.scrollWidth;
        }
      }
      function enhInfo() {
        const i = cur;
        modal(
          `${i.name}'s Enhancement Effect`,
          `<div class="txt">${i.enhSkill || "After reaching max level, enhancing the treasure (Enhancement Lv.1–6) adds a bonus effect."}</div><div class="aff">${enhList(i)
            .map((e) => `<div>${enhIcon()} Enhancement Lv.${e.lv} — ${hlg(e.effect)}</div>`)
            .join("")}</div>`,
        );
      }
      // Tab bar shared by the Story / Quotes / Relationships pop-ups
      function storyTabs(on) {
        const i = cur;
        const t = (k, label, fn) =>
          `<button class="btn" style="background:${on == k ? "#8b5513" : "#c58a3a"}" onclick="${fn}()">${label}</button>`;
        return `<div class="btns" style="padding:10px 14px">${t("story", "Story", "story")}${i.quotes ? t("quotes", "Quotes", "quotesView") : ""}${i.affection ? t("rel", "Relationships", "rel") : ""}</div>`;
      }
      function story() {
        const i = cur;
        modal(
          i.name + "'s Story",
          storyTabs("story") +
            (i.illust ? `<div class="sillust"><img src="${i.illust}" alt="${i.name}"></div>` : "") +
            (i.quote ? `<div class="quote">${i.quote}</div>` : "") +
            `<div class="txt">${i.story}</div>`,
        );
      }
      // Quote tables, shared by cookies/pets (Quotes tab) and costumes (right-hand pane)
      function quoteSets(sets) {
        const sec = (s) => {
          if (s.rows)
            return `<div class="qs">${s.title}</div>${s.rows.map((r, k) => `<div class="qrow${k % 2 ? " b" : ""}"><div class="ql">${r.label}</div><div class="qv">${r.text}</div></div>`).join("")}`;
          const n = s.lines.length;
          const cells = s.lines
            .map((l, k) => `<div class="${Math.floor(k / 2) % 2 ? "b" : ""}${n == 1 || (k == n - 1 && n % 2) ? " w" : ""}">${l}</div>`)
            .join("");
          return `<div class="qs">${s.title}</div><div class="qr">${cells}</div>`;
        };
        return (sets || [])
          .map((q) => `<div class="qh">${q.title}</div><div class="qt">${q.sections.map(sec).join("")}</div>`)
          .join("");
      }
      function quotesView() {
        const i = cur;
        modal(i.name + "'s Quotes", storyTabs("quotes") + quoteSets(i.quotes));
      }
      // Avatar for a relationship entry: looked up from the cookie it credits (r.id -> cookie.avatar).
      // Falls back to an inline r.img if given; shows nothing if neither exists.
      function relAvatar(r) {
        const c = r.id && (window.COOKIES || []).find((x) => x.id == r.id);
        const src = (c && c.avatar) || r.img;
        return src ? `<img class="rav" src="${src}" alt="">` : "";
      }
      function rel() {
        const i = cur;
        modal(
          "Relationships",
          `${storyTabs("rel")}${affTrack(i)}<div class="aff"><b>Relationship Chart</b>${(i.relations || []).map((r) => `<div>${relAvatar(r)}${r.who}: “${r.text}” (${r.type})</div>`).join("")}</div>`,
        );
      }
      function rewards() {
        modal(
          "Rewards",
          `<div class="txt">No reward data yet. Add a "rewards" field to this entry.</div>`,
        );
      }
      function costumes() {
        const i = cur;
        modal(
          `${i.name} (${i.costumes.length})`,
          `<div class="sc">${i.costumes
            .map((c, n) => {
              const on =
                c.equipped ||
                (c.tier == "default" && !i.costumes.some((x) => x.equipped));
              return `<div class="cc ${c.tier == "default" ? "t-common" : tierCls(c.tier)}"><b>${c.name}</b><div class="sp">${c.tier == "default" && !c.img ? spr(i) : spr(c)}</div>${c.tier != "default" ? `<span class="tier">${tierName(c.tier)}</span>` : ""}<div class="g">${c.bonus || c.desc || ""}</div>${on ? `<button class="eq">✔ Equipped</button>` : `<button onclick="equip(${n})">Equip</button>`}${c.info ? `<div class="g" style="margin-top:6px;text-align:left">${c.info}</div>` : ""}</div>`;
            })
            .join("")}</div>`,
        );
      }
      function equip(n) {
        cur.costumes.forEach((c, k) => (c.equipped = k == n && c.tier != "default"));
        costumes();
        renderDetail();
        renderList();
      }
      function combi() {
        const i = cur,
          list = i.combi || [];
        modal(
          "Combi Bonus",
          `<div class="sc" style="justify-content:center"><div class="cc" style="flex:0 1 200px"><div class="sp" style="height:200px">${spr(i)}</div></div>${
            list
              .map((b) => {
                const found = TABS[b.type].data().find((x) => x.id == b.id);
                const t = found || { name: b.name || b.id, emoji: "❔" };
                return `<div class="cc" style="flex:0 1 200px"><b>${t.name}</b><div class="sp">${spr(t)}</div><div class="g">${b.desc}</div>${found ? `<button class="p" style="background:#19b8d6" onclick="closeM();openItem('${b.id}','${b.type}')">Details</button>` : `<div class="g">Not in archive yet</div>`}</div>`;
              })
              .join("") || '<div class="txt">No combi bonus recorded yet.</div>'
          }</div>`,
        );
      }
      $("q").oninput = renderList;
      $("sort").onchange = renderList;
      renderList();
    </script>
  <script>
      // Register the service worker (needs https:// hosting; skipped on file://)
      if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
        window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
      }
    </script>
  </body>
</html>
